name: Daily PHI Duty & Official Reminders

on:
  schedule:
    # 01:30 UTC = 07:00 AM Sri Lanka Time
    - cron: '30 1 * * *'
    # 12:30 UTC = 06:00 PM Sri Lanka Time
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      test_slot:
        description: 'Select slot to trigger manually'
        required: true
        default: 'ALL_TEST'
        type: choice
        options:
          - ALL_TEST
          - MORNING_0700
          - EVENING_1800
          - AUTO

jobs:
  dispatch-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install nodemailer

      - name: Execute Notification Script
        env:
          TELEGRAM_BOT_TOKEN: "8853364712:AAEif92LUwmj2N4hdqo1SBKqE3XM0NMNTxI"
          TELEGRAM_CHAT_ID: "1485164955"
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: "phipoththapitiya@gmail.com , techtonicgadgetsl@gmail.com ,chandimacp195@gmail.com"
          TRIGGER_SLOT: ${{ github.event.inputs.test_slot || 'AUTO' }}
        run: node notify.js
