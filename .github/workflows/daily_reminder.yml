name: Daily PHI Duty & Official Reminders

on:
  schedule:
    # 01:30 UTC = 07:00 AM Sri Lanka Time
    - cron: '30 1 * * *'
    # 02:00 UTC = 07:30 AM Sri Lanka Time (Health 411 Disease Alerts & Claims)
    - cron: '0 2 * * *'
    # 02:30 UTC = 08:00 AM Sri Lanka Time
    - cron: '30 2 * * *'
    # 06:30 UTC = 12:00 PM Sri Lanka Time
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      test_slot:
        description: 'Select slot to trigger manually'
        required: true
        default: 'ALL_TEST'
        type: choice
        options:
          - ALL_TEST
          - SLOT_0700
          - SLOT_0730
          - SLOT_0800
          - SLOT_1200

jobs:
  dispatch-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine Trigger Time Slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SELECTED_SLOT=${{ github.event.inputs.test_slot }}" >> $GITHUB_ENV
          else
            CRON_HOUR=$(date -u +%H)
            CRON_MIN=$(date -u +%M)
            
            # 01:30 UTC -> 07:00 AM SL Time
            if [ "$CRON_HOUR" = "01" ]; then
              echo "SELECTED_SLOT=SLOT_0700" >> $GITHUB_ENV
            # 02:00 UTC -> 07:30 AM SL Time (Safe window up to 25 mins delay)
            elif [ "$CRON_HOUR" = "02" ] && [ "$CRON_MIN" -le "25" ]; then
              echo "SELECTED_SLOT=SLOT_0730" >> $GITHUB_ENV
            # 02:30 UTC -> 08:00 AM SL Time
            elif [ "$CRON_HOUR" = "02" ] || [ "$CRON_HOUR" = "03" ]; then
              echo "SELECTED_SLOT=SLOT_0800" >> $GITHUB_ENV
            # 06:30 UTC -> 12:00 PM SL Time
            elif [ "$CRON_HOUR" = "06" ] || [ "$CRON_HOUR" = "07" ]; then
              echo "SELECTED_SLOT=SLOT_1200" >> $GITHUB_ENV
            else
              echo "SELECTED_SLOT=SLOT_0730" >> $GITHUB_ENV
            fi
          fi

      - name: Execute Notification Script
        env:
          TELEGRAM_BOT_TOKEN: "8853364712:AAEif92LUwmj2N4hdqo1SBKqE3XM0NMNTxI"
          TELEGRAM_CHAT_ID: "1485164955"
          TRIGGER_SLOT: ${{ env.SELECTED_SLOT }}
        run: node notify.js
