name: Daily PHI Duty Reminder

on:
  schedule:
    # 01:30 UTC = 07:00 AM Sri Lanka Time (UTC + 5:30)
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Notification Script
        env:
          TELEGRAM_BOT_TOKEN: "8853364712:AAEif92LUwmj2N4hdqo1SBKqE3XM0NMNTxI"
          TELEGRAM_CHAT_ID: "1485164955"
        run: node notify.js
