<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHI Pocket Log - Health 253</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// ================= FIREBASE CONFIG =================
// These values come from your original HTML.
const firebaseConfig = {
  apiKey: "AIzaSyDwTY7RAoU2upO97fx2wI_4Et-Rttsl5U8",
  authDomain: "phi-pnb.firebaseapp.com",
  projectId: "phi-pnb",
  storageBucket: "phi-pnb.firebasestorage.app",
  messagingSenderId: "211731283128",
  appId: "1:211731283128:web:001a054fb332219928084d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ================= GEMINI =================
// Do NOT put your Gemini key in the HTML.
// Enter it in the UI. It is kept only in sessionStorage for this browser tab.
const GEMINI_MODEL = "gemini-3.5-flash";
let geminiApiKey = sessionStorage.getItem("phi_gemini_api_key") || "";

let selectedSession = "FN";
let unsubscribeSnapshot = null;

const $ = id => document.getElementById(id);
const getTodayISO = () => new Date().toISOString().slice(0, 10);

function setStatus(message, type = "normal") {
  const el = $("status");
  el.textContent = message || "";
  el.className = "text-xs font-medium " +
    (type === "error" ? "text-red-600" :
     type === "success" ? "text-emerald-600" : "text-slate-500");
}

// ================= API KEY UI =================
function updateKeyStatus() {
  $("keyStatus").textContent = geminiApiKey
    ? "Gemini key loaded for this tab"
    : "Gemini key not set";
}

window.saveApiKey = function () {
  const key = $("geminiKey").value.trim();
  if (!key) {
    setStatus("Enter a Gemini API key first.", "error");
    return;
  }
  geminiApiKey = key;
  sessionStorage.setItem("phi_gemini_api_key", key);
  $("geminiKey").value = "";
  updateKeyStatus();
  setStatus("Gemini API key saved for this browser tab.", "success");
};

window.clearApiKey = function () {
  geminiApiKey = "";
  sessionStorage.removeItem("phi_gemini_api_key");
  updateKeyStatus();
  setStatus("Gemini API key cleared.");
};

// ================= SESSION =================
window.setSession = function (session) {
  selectedSession = session;
  ["FN", "AN", "FULL"].forEach(type => {
    const el = $("btn-" + type);
    const active = type === session;
    el.className = "flex-1 py-2 text-xs font-semibold rounded-lg border transition " +
      (active
        ? "bg-emerald-600 text-white border-emerald-600 shadow-sm"
        : "bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100");
  });
};

// ================= VOICE =================
let recognition = null;
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = "si-LK";

  recognition.onstart = () => {
    $("micBtn").classList.add("bg-red-500", "text-white", "animate-pulse");
    setStatus("Listening in Sinhala...");
  };

  recognition.onresult = event => {
    const transcript = event.results[0][0].transcript;
    const note = $("rawNote");
    note.value = note.value ? note.value + " " + transcript : transcript;
    setStatus("Voice captured!", "success");
  };

  recognition.onerror = event => {
    setStatus("Mic error: " + event.error, "error");
  };

  recognition.onend = () => {
    $("micBtn").classList.remove("bg-red-500", "text-white", "animate-pulse");
  };
}

window.toggleMic = function () {
  if (!recognition) {
    alert("Speech Recognition is not supported in this browser. Use Chrome or Edge.");
    return;
  }
  try {
    recognition.start();
  } catch (err) {
    // Ignore the harmless 'already started' case.
    if (!String(err.message || err).toLowerCase().includes("started")) {
      setStatus("Microphone error: " + err.message, "error");
    }
  }
};

// ================= GEMINI =================
async function formatWithGemini(rawText, sessionType) {
  if (!geminiApiKey) {
    throw new Error("Gemini API key is not set. Open API Key, paste your new key and save it.");
  }

  const sessionLabel =
    sessionType === "FN" ? "Forenoon (Morning)" :
    sessionType === "AN" ? "Afternoon" : "Full Day Duty";

  const prompt = `You are an expert assistant for a Sri Lankan Public Health Inspector (PHI) maintaining the official Health 253 Pocket Notebook.

Convert the raw field note below into concise, professional, point-by-point English field log entries.

Duty Session: ${sessionLabel}

Strict rules:
1. Use professional PHI action phrasing, for example: "Conducts dengue breeding site survey at...".
2. Use one bullet point per task and start each line with •.
3. Preserve all names, locations, dates, counts and other specific facts from the raw note.
4. Do not invent facts.
5. Output ONLY the bullet points. No introduction, explanation or conclusion.

Raw Field Note:
${rawText}`;

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;

  const response = await fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-goog-api-key": geminiApiKey
    },
    body: JSON.stringify({
      contents: [{
        role: "user",
        parts: [{ text: prompt }]
      }]
    })
  });

  let data = null;
  try {
    data = await response.json();
  } catch {
    throw new Error("Gemini returned an invalid response.");
  }

  if (!response.ok) {
    const apiMessage = data?.error?.message || `HTTP ${response.status}`;
    throw new Error("Gemini API: " + apiMessage);
  }

  const text = data?.candidates?.[0]?.content?.parts?.
    map(part => part.text || "").join("").trim();

  if (!text) {
    const reason = data?.promptFeedback?.blockReason || "empty response";
    throw new Error("Gemini returned no text (" + reason + ").");
  }

  return text;
}

// ================= SAVE LOG =================
window.saveLog = async function () {
  const input = $("rawNote");
  const rawText = input.value.trim();
  const dutyDate = $("entryDate").value || getTodayISO();

  if (!rawText) {
    setStatus("Type or record a note first.", "error");
    return;
  }

  const saveBtn = $("saveBtn");
  saveBtn.disabled = true;
  saveBtn.classList.add("opacity-60", "cursor-not-allowed");
  setStatus("Processing with Gemini AI...");

  try {
    const formattedLog = await formatWithGemini(rawText, selectedSession);

    await addDoc(collection(db, "phi_pocket_logs"), {
      raw: rawText,
      formatted: formattedLog,
      session: selectedSession,
      dutyDate,
      timestamp: serverTimestamp(),
      timeStr: new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      })
    });

    input.value = "";
    $("filterDate").value = dutyDate;
    setStatus("Saved successfully!", "success");
    loadLogsForDate(dutyDate);
  } catch (error) {
    console.error(error);
    setStatus(error.message || "Save failed.", "error");
  } finally {
    saveBtn.disabled = false;
    saveBtn.classList.remove("opacity-60", "cursor-not-allowed");
  }
};

// ================= COPY =================
window.copyText = async function (text, button) {
  try {
    await navigator.clipboard.writeText(text);
    const old = button.textContent;
    button.textContent = "Copied";
    setTimeout(() => button.textContent = old, 1200);
  } catch {
    setStatus("Copy failed. Browser permission may be blocking clipboard access.", "error");
  }
};

// ================= LOG RENDERING =================
function getSessionInfo(session) {
  if (session === "AN") {
    return { name: "Afternoon (AN)", cls: "bg-amber-100 text-amber-800 border-amber-200" };
  }
  if (session === "FULL") {
    return { name: "Full Day", cls: "bg-purple-100 text-purple-800 border-purple-200" };
  }
  return { name: "Morning (FN)", cls: "bg-blue-100 text-blue-800 border-blue-200" };
}

function createLogCard(item) {
  const card = document.createElement("div");
  card.className = "bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm transition hover:shadow";

  const header = document.createElement("div");
  header.className = "flex items-center justify-between mb-2 gap-2";

  const session = getSessionInfo(item.session);
  const badge = document.createElement("span");
  badge.className = "text-xs font-semibold px-2 py-0.5 rounded-full border " + session.cls;
  badge.textContent = session.name;

  const date = document.createElement("span");
  date.className = "text-xs text-slate-400 font-medium text-right";
  date.textContent = `${item.dutyDate || ""} • ${item.timeStr || ""}`;

  header.append(badge, date);

  const formatted = document.createElement("div");
  formatted.className = "text-slate-800 text-sm whitespace-pre-wrap leading-relaxed font-medium bg-slate-50/80 p-3 rounded-lg border border-slate-100";
  formatted.textContent = item.formatted || "";

  const footer = document.createElement("div");
  footer.className = "flex justify-between items-center mt-2.5 pt-2 border-t border-slate-100 gap-2";

  const raw = document.createElement("span");
  raw.className = "truncate text-xs text-slate-400 max-w-[180px]";
  raw.title = item.raw || "";
  raw.textContent = "Input: " + (item.raw || "");

  const copyBtn = document.createElement("button");
  copyBtn.className = "text-emerald-600 font-semibold text-xs bg-emerald-50 px-2.5 py-1 rounded-md";
  copyBtn.textContent = "Copy";
  copyBtn.addEventListener("click", () => copyText(item.formatted || "", copyBtn));

  footer.append(raw, copyBtn);
  card.append(header, formatted, footer);
  return card;
}

// ================= LOAD LOGS =================
window.loadLogsForDate = function (dateFilter = null) {
  if (unsubscribeSnapshot) {
    unsubscribeSnapshot();
    unsubscribeSnapshot = null;
  }

  let q;

  // IMPORTANT: filtered query intentionally uses ONLY where().
  // We sort the results in JavaScript so Firebase does not require a composite index.
  if (dateFilter && dateFilter !== "ALL") {
    q = query(
      collection(db, "phi_pocket_logs"),
      where("dutyDate", "==", dateFilter)
    );
  } else {
    q = query(
      collection(db, "phi_pocket_logs"),
      orderBy("timestamp", "desc")
    );
  }

  unsubscribeSnapshot = onSnapshot(q, snapshot => {
    const list = $("logsList");
    list.innerHTML = "";

    const items = snapshot.docs.map(doc => ({
      id: doc.id,
      ...doc.data()
    }));

    if (dateFilter && dateFilter !== "ALL") {
      items.sort((a, b) => {
        const aTime = a.timestamp?.toMillis?.() || 0;
        const bTime = b.timestamp?.toMillis?.() || 0;
        return aTime - bTime;
      });
    }

    if (!items.length) {
      const empty = document.createElement("div");
      empty.className = "text-center py-8 text-slate-400 bg-white rounded-xl border border-dashed border-slate-300";
      empty.textContent = "තෝරාගත් දිනය සඳහා සටහන් කිසිවක් නැත.";
      list.appendChild(empty);
      return;
    }

    items.forEach(item => list.appendChild(createLogCard(item)));
  }, error => {
    console.error("Firestore error:", error);
    const list = $("logsList");
    list.innerHTML = "";

    const box = document.createElement("div");
    box.className = "p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs";
    box.textContent = "Firestore error: " + (error.message || error.code);
    list.appendChild(box);

    setStatus("Firestore error: " + (error.message || error.code), "error");
  });
};

window.onFilterChange = function () {
  const date = $("filterDate").value;
  loadLogsForDate(date || "ALL");
};

window.showAllLogs = function () {
  $("filterDate").value = "";
  loadLogsForDate("ALL");
};

// ================= START =================
window.addEventListener("DOMContentLoaded", () => {
  const today = getTodayISO();
  $("entryDate").value = today;
  $("filterDate").value = today;
  updateKeyStatus();
  loadLogsForDate(today);
});
</script>
</head>

<body class="bg-slate-100 min-h-screen p-4 max-w-md mx-auto text-slate-800 font-sans pb-16">

<header class="mb-4 text-center">
  <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full text-xs font-bold mb-1">
    <i class="ph ph-notebook"></i> Health 253 Assistant
  </div>
  <h1 class="text-lg font-bold text-slate-900">PHI Pocket Log Portal</h1>
  <p class="text-xs text-slate-500">Live Sinhala/Singlish to Official Sync</p>
</header>

<!-- API KEY -->
<div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-4">
  <div class="flex items-center justify-between mb-2">
    <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Gemini API Key</label>
    <span id="keyStatus" class="text-[10px] text-slate-400"></span>
  </div>

  <div class="flex gap-2">
    <input id="geminiKey" type="password" autocomplete="off" placeholder="Paste new Gemini API key" class="flex-1 min-w-0 text-xs border border-slate-200 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-emerald-500">
    <button onclick="saveApiKey()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-lg">Save</button>
    <button onclick="clearApiKey()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-semibold px-3 py-2 rounded-lg">Clear</button>
  </div>

  <p class="text-[10px] text-slate-400 mt-2">For local/testing use. For a public website, move Gemini calls to a backend/Cloud Function.</p>
</div>

<!-- DUTY FORM -->
<div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-5">
  <div class="flex items-center justify-between mb-2">
    <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Duty Details</label>
    <div class="flex items-center gap-1">
      <span class="text-xs text-slate-400">Date:</span>
      <input type="date" id="entryDate" class="text-xs border rounded-lg px-2 py-1 bg-slate-50 text-slate-700 outline-none focus:ring-1 focus:ring-emerald-500">
    </div>
  </div>

  <div class="flex gap-2 mb-3">
    <button type="button" id="btn-FN" onclick="setSession('FN')" class="flex-1 py-2 text-xs font-semibold rounded-lg border bg-emerald-600 text-white border-emerald-600 shadow-sm">🌅 Morning (FN)</button>
    <button type="button" id="btn-AN" onclick="setSession('AN')" class="flex-1 py-2 text-xs font-semibold rounded-lg border bg-slate-50 text-slate-600 border-slate-200">🌇 Afternoon (AN)</button>
    <button type="button" id="btn-FULL" onclick="setSession('FULL')" class="flex-1 py-2 text-xs font-semibold rounded-lg border bg-slate-50 text-slate-600 border-slate-200">📅 Full Day</button>
  </div>

  <div class="relative">
    <textarea id="rawNote" rows="3" class="w-full p-3 pr-12 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none placeholder:text-slate-400" placeholder="සිංහලෙන් කියවන්න (Mic) හෝ Singlish වලින් ටයිප් කරන්න..."></textarea>
    <button type="button" id="micBtn" onclick="toggleMic()" class="absolute right-2.5 bottom-3 p-2 bg-emerald-100 text-emerald-700 hover:bg-emerald-200 rounded-full transition" title="Speak in Sinhala">
      <i class="ph ph-microphone text-lg"></i>
    </button>
  </div>

  <div class="flex justify-between items-center mt-3 gap-2">
    <span id="status" class="text-xs font-medium text-slate-500"></span>
    <button id="saveBtn" onclick="saveLog()" class="shrink-0 bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-sm transition shadow-sm flex items-center gap-1.5">
      <i class="ph ph-paper-plane-right"></i> Format & Save
    </button>
  </div>
</div>

<!-- FILTER -->
<div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm mb-4">
  <div class="flex items-center justify-between gap-2">
    <div class="flex items-center gap-1.5 flex-1">
      <i class="ph ph-calendar text-emerald-600 text-base"></i>
      <span class="text-xs font-bold text-slate-700">Filter Date:</span>
      <input type="date" id="filterDate" onchange="onFilterChange()" class="text-xs border rounded-lg px-2 py-1 bg-slate-50 text-slate-700 outline-none focus:ring-1 focus:ring-emerald-500 flex-1">
    </div>
    <button onclick="showAllLogs()" class="text-xs font-semibold text-slate-500 hover:text-slate-700 bg-slate-100 px-2.5 py-1 rounded-lg border border-slate-200 transition">All Logs</button>
  </div>
</div>

<!-- HISTORY -->
<div>
  <div class="flex justify-between items-center mb-2 px-1 gap-2">
    <h2 class="text-sm font-bold text-slate-700">Pocket Note History</h2>
    <span class="text-xs text-slate-400 text-right">Ready to write in Health 253</span>
  </div>
  <div id="logsList" class="space-y-3"></div>
</div>

</body>
</html>
