// ================= FREE TIER SMART RETRY SYSTEM =================
async function fetchGeminiWithRetry(url, options, maxAttempts = 5) {
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      const response = await fetch(url, options);
      if (response.ok) return response;

      // Quota/Rate limit (429) හෝ Server busy (503) ආ විට
      if (response.status === 429 || (response.status >= 500 && response.status < 600)) {
        if (attempt === maxAttempts) return response;

        // Rate limit එක නිදහස් වන තෙක් තත්පර 3, 6, 12 ආදී ලෙස රැඳී සිට නැවත ට්‍රයි කරයි
        const waitTime = (Math.pow(2, attempt) * 1500);
        setStatus(`Free Quota limit: රැඳී සිටින්න (${Math.round(waitTime/1000)}s)...`, "normal");
        await new Promise(resolve => setTimeout(resolve, waitTime));
        continue;
      }

      return response;
    } catch (error) {
      if (attempt === maxAttempts) throw error;
      await new Promise(resolve => setTimeout(resolve, 2000));
    }
  }
  throw new Error("Gemini service is unavailable. Please try again in a minute.");
}

// ================= MEDIA ATTACHMENTS =================
function formatMediaSize(bytes) {
  if (!bytes) return "0 B";
  const units = ["B", "KB", "MB", "GB"];
  const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
  return `${(bytes / Math.pow(1024, i)).toFixed(i ? 1 : 0)} ${units[i]}`;
}

function setMediaStatus(message = "", type = "normal") {
  const el = $("mediaStatus");
  if (!el) return;
  el.textContent = message;
  el.className =
    "text-[10px] mt-1 " +
    (type === "error"
      ? "text-red-600 dark:text-red-400"
      : type === "success"
        ? "text-emerald-600 dark:text-emerald-400"
        : "text-slate-400 dark:text-slate-500");
}

function renderPendingMediaAttachments() {
  const wrap = $("pendingMediaAttachments");
  if (!wrap) return;
  wrap.innerHTML = "";

  if (!pendingMediaAttachments.length) {
    wrap.classList.add("hidden");
    return;
  }

  wrap.classList.remove("hidden");
  pendingMediaAttachments.forEach((item, index) => {
    const row = document.createElement("div");
    row.className =
      "flex items-center gap-2 px-2.5 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs";

    const icon = document.createElement("i");
    icon.className =
      "ph " +
      (item.type === "video" ? "ph-video-camera" : item.type === "audio" ? "ph-waveform" : "ph-camera") +
      " text-emerald-600 text-base shrink-0";

    const info = document.createElement("div");
    info.className = "min-w-0 flex-1";

    const name = document.createElement("div");
    name.className = "font-semibold truncate";
    name.textContent = item.name || `${item.type} attachment`;

    const size = document.createElement("div");
    size.className = "text-[10px] text-slate-400";
    size.textContent = formatMediaSize(item.blob?.size || item.size || 0);

    info.append(name, size);

    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "p-1.5 rounded-full text-red-500 hover:bg-red-100 dark:hover:bg-red-900/30 shrink-0";
    remove.title = "Remove attachment";
    remove.innerHTML = '<i class="ph ph-x"></i>';
    remove.addEventListener("click", () => {
      pendingMediaAttachments.splice(index, 1);
      renderPendingMediaAttachments();
      setMediaStatus("");
    });

    row.append(icon, info, remove);
    wrap.appendChild(row);
  });
}

function addPendingMedia(blob, type, name) {
  if (!blob || !blob.size) {
    setMediaStatus("No media was captured.", "error");
    return;
  }
  pendingMediaAttachments.push({
    type,
    name,
    blob,
    size: blob.size,
    contentType: blob.type || "application/octet-stream"
  });
  renderPendingMediaAttachments();
  const label = type === "video" ? "🎥 Video" : type === "audio" ? "🎙️ Audio" : "📷 Photo";
  setMediaStatus(`${label} attached to this daily note.`, "success");
}

function clearPendingMediaAttachments() {
  pendingMediaAttachments = [];
  renderPendingMediaAttachments();
  setMediaStatus("");
}

async function uploadPendingMediaAttachments(logId) {
  if (!pendingMediaAttachments.length) return [];
  const uploaded = [];
  try {
    for (const item of pendingMediaAttachments) {
      const safeName = String(item.name || `${item.type}.bin`).replace(/[^a-zA-Z0-9._-]+/g, "_").slice(-100);
      const storagePath = `phi_pocket_attachments/${logId}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}_${safeName}`;
      const storageRef = ref(storage, storagePath);

      const snapshot = await uploadBytes(storageRef, item.blob, {
        contentType: item.contentType || item.blob.type || "application/octet-stream"
      });
      const url = await getDownloadURL(snapshot.ref);

      uploaded.push({
        type: item.type,
        name: item.name,
        size: item.size || item.blob.size,
        contentType: item.contentType || item.blob.type || "application/octet-stream",
        url,
        storagePath
      });
    }
    return uploaded;
  } catch (error) {
    for (const item of uploaded) {
      try { await deleteObject(ref(storage, item.storagePath)); } catch {}
    }
    throw new Error("Media upload failed: " + (error?.message || ""));
  }
}

async function deleteStoredMediaAttachments(attachments = []) {
  for (const item of attachments || []) {
    if (!item?.storagePath) continue;
    try { await deleteObject(ref(storage, item.storagePath)); } catch (error) {
      console.warn("Could not delete media attachment:", error);
    }
  }
}

// Media Audio/Video Recorders
let attachmentAudioRecorder = null, attachmentAudioStream = null, attachmentAudioChunks = [];
let attachmentVideoRecorder = null, attachmentVideoStream = null, attachmentVideoChunks = [];

function getSupportedMediaMimeType(kind = "audio") {
  const audioTypes = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
  const videoTypes = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm", "video/mp4"];
  const list = kind === "audio" ? audioTypes : videoTypes;
  for (const t of list) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported?.(t)) return t;
  }
  return "";
}

window.toggleAttachmentAudio = async function () {
  if (attachmentAudioRecorder && attachmentAudioRecorder.state !== "inactive") {
    attachmentAudioRecorder.stop();
    return;
  }
  try {
    attachmentAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = getSupportedMediaMimeType("audio");
    attachmentAudioRecorder = new MediaRecorder(attachmentAudioStream, mime ? { mimeType: mime } : {});
    attachmentAudioChunks = [];

    attachmentAudioRecorder.ondataavailable = e => { if (e.data?.size) attachmentAudioChunks.push(e.data); };
    attachmentAudioRecorder.onstop = () => {
      const blob = new Blob(attachmentAudioChunks, { type: mime || "audio/webm" });
      if (attachmentAudioStream) attachmentAudioStream.getTracks().forEach(t => t.stop());
      $("attachAudioBtn").classList.remove("bg-red-500", "text-white", "animate-pulse");
      addPendingMedia(blob, "audio", `field-audio-${Date.now()}.webm`);
    };

    attachmentAudioRecorder.start(250);
    $("attachAudioBtn").classList.add("bg-red-500", "text-white", "animate-pulse");
    setMediaStatus("🎙️ Recording audio... click again to stop.");
  } catch (err) {
    setMediaStatus("Mic error: " + err.message, "error");
  }
};

// ================= CURSOR TRACKING =================
let savedCursorStart = 0, savedCursorEnd = 0;
function rememberNoteCursor() {
  const note = $("rawNote");
  if (!note) return;
  savedCursorStart = note.selectionStart ?? note.value.length;
  savedCursorEnd = note.selectionEnd ?? savedCursorStart;
}

function insertTextAtSavedCursor(text) {
  const note = $("rawNote");
  if (!note) return;
  const val = note.value || "";
  const start = Math.max(0, Math.min(savedCursorStart, val.length));
  const end = Math.max(start, Math.min(savedCursorEnd, val.length));
  const left = val.slice(0, start) + (val.slice(0, start) && !val.slice(0, start).endsWith("\n") ? "\n" : "");
  const right = (val.slice(end) && !val.slice(end).startsWith("\n") ? "\n" : "") + val.slice(end);

  note.value = left + text.trim() + right;
  note.focus();
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => {
      const res = String(reader.result || "");
      resolve(res.slice(res.indexOf(",") + 1));
    };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// ================= GEMINI CALLS =================
async function transcribeRecordedAudio(blob) {
  if (!geminiApiKey) throw new Error("Gemini API key is not set.");
  const base64Audio = await blobToBase64(blob);
  const language = $("micLang")?.value === "en-US" ? "English" : "Sinhala (සිංහල)";

  const prompt = `Transcribe this voice note for a Sri Lankan Public Health Inspector.
Language: ${language}
Rules:
1. Exact words only.
2. If Sinhala/Singlish, convert to simple readable English/Sinhala.
3. Return ONLY transcription without introductions.`;

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(geminiApiKey)}`;
  const response = await fetchGeminiWithRetry(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{
        parts: [
          { text: prompt },
          { inlineData: { mimeType: blob.type || "audio/webm", data: base64Audio } }
        ]
      }]
    })
  });

  const data = await response.json();
  if (!response.ok) throw new Error(data?.error?.message || "Transcription failed.");
  return data?.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("").trim();
}

async function extractVisionText(file) {
  if (!geminiApiKey) throw new Error("Gemini API key is not set.");
  const base64 = await blobToBase64(file);
  const prompt = "Extract all readable text from this document/image for PHI field notes. Return ONLY text.";

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(geminiApiKey)}`;
  const response = await fetchGeminiWithRetry(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{
        parts: [
          { text: prompt },
          { inlineData: { mimeType: file.type || "application/octet-stream", data: base64 } }
        ]
      }]
    })
  });

  const data = await response.json();
  if (!response.ok) throw new Error(data?.error?.message || "Extraction failed.");
  return data?.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("").trim();
}

async function formatWithGemini(rawText, sessionType) {
  if (!geminiApiKey) throw new Error("Gemini API key is not set.");
  const sessionLabel = sessionType === "FN" ? "Morning (FN)" : sessionType === "AN" ? "Afternoon (AN)" : "Full Day";

  const prompt = `You are a helpful assistant for a Public Health Inspector (PHI) in Sri Lanka writing daily notes in Health 253.
Convert the raw note into simple everyday English bullet points starting with •.
Session: ${sessionLabel}

Raw Field Note:
${rawText}`;

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(geminiApiKey)}`;
  const response = await fetchGeminiWithRetry(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
  });

  const data = await response.json();
  if (!response.ok) throw new Error(data?.error?.message || "Formatting failed.");
  return data?.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("").trim();
}

// Voice recording
let voiceRecorder = null, voiceStream = null, voiceChunks = [];
window.toggleMic = async function () {
  if (voiceRecorder && voiceRecorder.state !== "inactive") {
    voiceRecorder.stop();
    return;
  }
  try {
    voiceStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = getSupportedMediaMimeType("audio");
    voiceRecorder = new MediaRecorder(voiceStream, mime ? { mimeType: mime } : {});
    voiceChunks = [];

    voiceRecorder.ondataavailable = e => { if (e.data?.size) voiceChunks.push(e.data); };
    voiceRecorder.onstop = async () => {
      const blob = new Blob(voiceChunks, { type: mime || "audio/webm" });
      if (voiceStream) voiceStream.getTracks().forEach(t => t.stop());
      $("micBtn").classList.remove("bg-red-500", "text-white", "animate-pulse");
      setStatus("Converting voice with Gemini...", "normal");

      try {
        const text = await transcribeRecordedAudio(blob);
        const note = $("rawNote");
        note.value = note.value ? note.value + " " + text : text;
        setStatus("Voice converted successfully!", "success");
      } catch (err) {
        setStatus(err.message, "error");
      }
    };

    voiceRecorder.start(250);
    $("micBtn").classList.add("bg-red-500", "text-white", "animate-pulse");
    setStatus("Recording voice... speak now.", "success");
  } catch (err) {
    setStatus("Microphone permission error: " + err.message, "error");
  }
};

// Document & GPS Handlers
window.openImportPicker = () => { rememberNoteCursor(); $("documentInput").click(); };
window.handleDocumentImport = async function (e) {
  const file = e.target.files?.[0];
  e.target.value = "";
  if (!file) return;

  rememberNoteCursor();
  try {
    setStatus("Reading file...", "normal");
    let text = "";
    if (file.type.startsWith("image/") || file.type === "application/pdf") {
      text = await extractVisionText(file);
    } else if (file.name.endsWith(".docx") && window.mammoth) {
      const res = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
      text = res.value;
    } else {
      text = await file.text();
    }
    insertTextAtSavedCursor(text);
    setStatus("Text imported successfully!", "success");
  } catch (err) {
    setStatus(err.message, "error");
  }
};

window.insertCurrentLocation = function () {
  rememberNoteCursor();
  if (!navigator.geolocation) return setStatus("GPS not supported.", "error");
  setStatus("Getting GPS fix...", "normal");

  navigator.geolocation.getCurrentPosition(
    pos => {
      const txt = `📍 Location: ${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)} (±${Math.round(pos.coords.accuracy)} m)`;
      insertTextAtSavedCursor(txt);
      setStatus("GPS added!", "success");
    },
    err => setStatus("GPS error: " + err.message, "error"),
    { enableHighAccuracy: true, timeout: 15000 }
  );
};

window.setSession = function (session) {
  selectedSession = session;
  ["FN", "AN", "FULL"].forEach(type => {
    $("btn-" + type).className = "flex-1 py-2 text-xs font-semibold rounded-lg border transition " +
      (type === session

window.saveLog = async function () {
  const input = $("rawNote");
  const rawText = input.value.trim();
  const dutyDate = $("entryDate").value || getTodayISO();

  if (!rawText && !pendingMediaAttachments.length) {
    return setStatus("Please add notes or media attachments first.", "error");
  }

  const saveBtn = $("saveBtn");
  saveBtn.disabled = true;
  setStatus("Formatting and saving note...", "normal");

  let uploadedAttachments = [];
  try {
    const formattedLog = rawText
      ? await formatWithGemini(rawText, selectedSession)
      : "• Field media attached to this daily note.";

    const logRef = doc(collection(db, "phi_pocket_logs"));
    uploadedAttachments = await uploadPendingMediaAttachments(logRef.id);

    await setDoc(logRef, {
      raw: rawText,
      formatted: formattedLog,
      session: selectedSession,
      dutyDate,
      timestamp: serverTimestamp(),
      timeStr: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
      attachments: uploadedAttachments
    });

    input.value = "";
    clearPendingMediaAttachments();
    setStatus("Saved successfully!", "success");
    loadLogsForDate(dutyDate);
  } catch (error) {
    await deleteStoredMediaAttachments(uploadedAttachments);
    setStatus(error.message, "error");
  } finally {
    saveBtn.disabled = false;
  }
};

window.copyText = async (txt, btn) => {
  await navigator.clipboard.writeText(txt);
  btn.textContent = "Copied";
  setTimeout(() => btn.textContent = "Copy", 1200);
};

window.deleteLog = async (id, atts) => {
  if (confirm("Delete this log?")) {
    await deleteDoc(doc(db, "phi_pocket_logs", id));
    await deleteStoredMediaAttachments(atts);
    loadLogsForDate($("filterDate").value || getTodayISO());
  }
};

    <div class="flex items-center justify-between mt-2.5 pt-2 border-t border-slate-100 dark:border-slate-700 gap-2">
      <span class="truncate text-xs text-slate-400 max-w-[160px]">Raw: ${item.raw || ""}</span>
      <div class="flex gap-1.5 ml-auto">
        <button onclick="copyText('${(item.formatted || '').replace(/'/g, "\\'")}', this)" class="text-emerald-700 text-xs bg-emerald-50 px-2 py-1 rounded">Copy</button>
        <button onclick="deleteLog('${item.id}', ${JSON.stringify(item.attachments || [])})" class="text-red-700 text-xs bg-red-50 px-2 py-1 rounded">Delete</button>
      </div>
    </div>
  `;
  return card;
}

window.loadLogsForDate = function (dateFilter) {
  if (unsubscribeSnapshot) unsubscribeSnapshot();
  let q = dateFilter && dateFilter !== "ALL"
    ? query(collection(db, "phi_pocket_logs"), where("dutyDate", "==", dateFilter))
    : query(collection(db, "phi_pocket_logs"), orderBy("timestamp", "desc"));

  unsubscribeSnapshot = onSnapshot(q, snap => {
    const list = $("logsList");
    list.innerHTML = "";
    if (snap.empty) {
      list.innerHTML = '<div class="text-center py-6 text-slate-400 text-xs">සටහන් කිසිවක් නැත.</div>';
      return;
    }
    snap.docs.forEach(d => list.appendChild(createLogCard({ id: d.id, ...d.data() })));
  });
};

window.onFilterChange = () => loadLogsForDate($("filterDate").value || "ALL");
window.showAllLogs = () => loadLogsForDate("ALL");

window.addEventListener("DOMContentLoaded", () => {
  const today = getTodayISO();
  $("entryDate").value = today;
  $("filterDate").value = today;
  updateKeyStatus();
  setSession("FN");
  loadLogsForDate(today);

  ["keyup", "click", "focus", "select", "input"].forEach(evt => {
    $("rawNote")?.addEventListener(evt, rememberNoteCursor);
  });
});
</script>
</head>

<body class="bg-slate-100 dark:bg-slate-950 min-h-screen p-4 max-w-md mx-auto text-slate-800 dark:text-slate-100 font-sans pb-16">

<header class="mb-4 text-center relative">
  <button onclick="toggleTheme()" class="absolute right-0 top-0 w-9 h-9 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-center">
    <i id="themeIcon" class="ph ph-moon"></i>
  </button>
  <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-emerald-100 dark:bg-emerald-900/40 text-emerald-800 dark:text-emerald-300 rounded-full text-xs font-bold mb-1">
    <i class="ph ph-notebook"></i> Health 253 Assistant
  </div>
  <h1 class="text-lg font-bold text-slate-900 dark:text-white">PHI Pocket Log Portal</h1>
</header>

<!-- API KEY -->
<div class="bg-white dark:bg-slate-900 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 mb-4">
  <div class="flex items-center justify-between mb-2">
    <label class="text-xs font-bold text-slate-600 dark:text-slate-300 uppercase">Gemini API Key</label>
    <span id="keyStatus" class="text-[10px] text-slate-400"></span>
  </div>
  <div class="flex gap-2">
    <input id="geminiKey" type="password" placeholder="Paste Gemini API key" class="flex-1 text-xs border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-2 bg-white dark:bg-slate-800">
    <button onclick="saveApiKey()" class="bg-emerald-600 text-white text-xs font-bold px-3 py-2 rounded-lg">Save</button>
    <button onclick="clearApiKey()" class="bg-slate-100 dark:bg-slate-800 text-xs px-3 py-2 rounded-lg">Clear</button>
  </div>
</div>

<!-- FORM -->
<div class="bg-white dark:bg-slate-900 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 mb-5">
  <div class="flex items-center justify-between mb-2">
    <label class="text-xs font-bold text-slate-600 dark:text-slate-300 uppercase">Duty Details</label>
    <input type="date" id="entryDate" class="text-xs border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 bg-slate-50 dark:bg-slate-800">
  </div>

  <div class="flex gap-2 mb-3">
    <button type="button" id="btn-FN" onclick="setSession('FN')" class="flex-1 py-2 text-xs font-semibold rounded-lg border">🌅 Morning</button>
    <button type="button" id="btn-AN" onclick="setSession('AN')" class="flex-1 py-2 text-xs font-semibold rounded-lg border">🌇 Afternoon</button>
    <button type="button" id="btn-FULL" onclick="setSession('FULL')" class="flex-1 py-2 text-xs font-semibold rounded-lg border">📅 Full Day</button>
  </div>

  <div class="relative">
    <textarea id="rawNote" rows="5" class="w-full p-3 pr-24 border border-slate-200 dark:border-slate-700 rounded-xl text-sm bg-white dark:bg-slate-800 outline-none" placeholder="සිංහලෙන් කියවන්න (Mic) හෝ Singlish වලින් ටයිප් කරන්න..."></textarea>
    
    <div class="absolute right-2 bottom-2.5 flex items-center gap-1 bg-slate-50 dark:bg-slate-900/90 p-1 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
      <button type="button" onclick="openImportPicker()" class="p-2 bg-blue-100 dark:bg-blue-900/40 text-blue-700 rounded-full" title="File OCR"><i class="ph ph-file-image"></i></button>
      <button type="button" onclick="insertCurrentLocation()" class="p-2 bg-amber-100 dark:bg-amber-900/40 text-amber-700 rounded-full" title="GPS"><i class="ph ph-map-pin"></i></button>
      <select id="micLang" class="text-[10px] bg-transparent outline-none max-w-[65px]">
        <option value="si-LK">සිංහල</option>
        <option value="en-US">English</option>
      </select>
      <button type="button" id="micBtn" onclick="toggleMic()" class="p-2 bg-emerald-100 dark:bg-emerald-900/50 text-emerald-700 rounded-full" title="Voice"><i class="ph ph-microphone"></i></button>
    </div>
  </div>

  <div class="mt-3 p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/60">
    <span class="text-[11px] font-bold text-slate-600 dark:text-slate-300">Field Media Attachments</span>
    <div class="grid grid-cols-3 gap-2 mt-2">
      <button type="button" id="attachAudioBtn" onclick="toggleAttachmentAudio()" class="py-2.5 px-2 rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-700 text-xs font-semibold">🎙️ Audio</button>
      <button type="button" id="attachVideoBtn" onclick="toggleAttachmentVideo()" class="py-2.5 px-2 rounded-xl border border-purple-200 bg-purple-50 text-purple-700 text-xs font-semibold">🎥 Video</button>
      <button type="button" onclick="openPhotoAttachmentPicker()" class="py-2.5 px-2 rounded-xl border border-rose-200 bg-rose-50 text-rose-700 text-xs font-semibold">📷 Photo</button>
    </div>
  </div>

  <input id="documentInput" type="file" class="hidden" accept="image/*,application/pdf,.docx,.txt" onchange="handleDocumentImport(event)" />
  <input id="photoAttachmentInput" type="file" class="hidden" accept="image/*" capture="environment" onchange="handlePhotoAttachment(event)" />

  <div id="pendingMediaAttachments" class="hidden mt-2 space-y-1"></div>
  <div id="mediaStatus" class="text-[10px] text-slate-400 mt-1"></div>

  <div class="flex justify-between items-center mt-3 gap-2">
    <span id="status" class="text-xs font-medium text-slate-500"></span>
    <button id="saveBtn" onclick="saveLog()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-sm shadow-sm flex items-center gap-1.5">
      <i class="ph ph-paper-plane-right"></i> Format & Save
    </button>
  </div>
</div>

<!-- HISTORY -->
<div class="bg-white dark:bg-slate-900 p-3 rounded-2xl border border-slate-200 dark:border-slate-700 mb-4 flex items-center justify-between gap-2">
  <input type="date" id="filterDate" onchange="onFilterChange()" class="text-xs border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1 bg-slate-50 dark:bg-slate-800 flex-1">
  <button onclick="showAllLogs()" class="text-xs font-semibold px-2.5 py-1 rounded-lg border">All Logs</button>
</div>

<div id="logsList" class="space-y-3"></div>

</body>
</html>
