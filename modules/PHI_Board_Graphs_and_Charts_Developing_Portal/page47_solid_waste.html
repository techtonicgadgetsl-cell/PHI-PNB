<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHI Manual Page 47 - Solid Waste Management (A4 Portrait)</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 210mm;
            margin: 0 auto;
        }

        /* --- Strict A4 Portrait Printable Container --- */
        .print-a4-page {
            background: #ffffff;
            width: 210mm;
            height: 297mm; /* Exact A4 Height */
            padding: 12mm 15mm;
            margin: 0 auto 20px auto;
            border: 4px double #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .page-main-title {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 5px;
            height: 20px;
        }

        /* Balanced 2-Section Stacked Grid for Full Page Fill */
        .charts-container-stack {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Equal Gap Between Graphs */
            height: calc(100% - 30px);
        }

        .chart-card {
            background: #ffffff;
            border: 2px solid #000;
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex: 1; /* Equally split height on A4 */
        }

        .chart-header {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .chart-wrapper {
            position: relative;
            background-color: #ffffff;
            border: 1px solid #000;
            padding: 6px;
            flex: 1; /* Dynamic stretch */
            width: 100%;
        }

        /* --- Portal Styling --- */
        .portal-card {
            background: #fff;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            max-width: 210mm;
            margin-left: auto;
            margin-right: auto;
        }

        .portal-card h3 {
            margin-top: 0;
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
            font-size: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .form-group select, .form-group input {
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
        }

        .btn {
            padding: 9px 16px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            margin-right: 8px;
        }

        .btn-config { background-color: #6c757d; color: white; }
        .btn-update { background-color: #28a745; color: white; }
        .btn-print { background-color: #007bff; color: white; }

        /* --- Strict Print Rules for A4 Portrait Page Fill --- */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }

            body {
                background: white;
                padding: 0;
                margin: 0;
            }

            .container {
                max-width: 100%;
                margin: 0;
                padding: 0;
            }

            .portal-card, h2 {
                display: none !important;
            }

            .print-a4-page {
                border: 4px double #000 !important;
                box-shadow: none !important;
                width: 210mm !important;
                height: 297mm !important;
                padding: 10mm 12mm !important;
                margin: 0 !important;
                page-break-after: avoid;
                page-break-inside: avoid;
            }

            .chart-card {
                border: 2px solid #000 !important;
            }

            .chart-wrapper {
                background-color: #ffffff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center; font-size: 18px;">PHI Office Data Portal - Page 47</h2>

    <!-- PRINTABLE A4 PORTRAIT PAGE -->
    <div class="print-a4-page">
        <div class="page-main-title">SOLID WASTE MANAGEMENT</div>

        <div class="charts-container-stack">
            <!-- 1. PREVIOUS YEAR 2 GRAPH -->
            <div class="chart-card">
                <div class="chart-header" id="hdrPrevYear2">PREVIOUS YEAR 2</div>
                <div class="chart-wrapper">
                    <canvas id="chartPrevYear2"></canvas>
                </div>
            </div>

            <!-- 2. PREVIOUS YEAR 1 GRAPH -->
            <div class="chart-card">
                <div class="chart-header" id="hdrPrevYear1">PREVIOUS YEAR 1</div>
                <div class="chart-wrapper">
                    <canvas id="chartPrevYear1"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- 0. YEAR HEADER SETUP PORTAL -->
    <div class="portal-card">
        <h3>0. Annual Year Setup (Auto / Manual Override)</h3>
        <div class="form-grid">
            <div class="form-group">
                <label>Top Graph Label</label>
                <input type="text" id="inputYearTop">
            </div>
            <div class="form-group">
                <label>Bottom Graph Label</label>
                <input type="text" id="inputYearBottom">
            </div>
        </div>
        <button type="button" class="btn btn-config" onclick="applyYearHeaders()">Update Year Labels</button>
    </div>

    <!-- DATA INPUT PORTAL -->
    <div class="portal-card">
        <h3>1. Solid Waste Disposal Methods Data Entry Portal</h3>
        <p style="font-size:11px; color:#555;">Enter household counts for each waste disposal method (M1 to M5).</p>
        <form id="dataForm">
            <div class="form-grid" style="grid-template-columns: 1fr; margin-bottom: 10px;">
                <div class="form-group">
                    <label>Select Target Graph</label>
                    <select id="targetGraphSelect">
                        <option value="top" id="optYearTop">PREVIOUS YEAR 2</option>
                        <option value="bottom" id="optYearBottom">PREVIOUS YEAR 1</option>
                    </select>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label style="color: black;">M1 - Burning (Black)</label>
                    <input type="number" id="valM1" min="0" value="0">
                </div>
                <div class="form-group">
                    <label style="color: navy;">M2 - Burying (Blue)</label>
                    <input type="number" id="valM2" min="0" value="0">
                </div>
                <div class="form-group">
                    <label style="color: green;">M3 - Composting (Green)</label>
                    <input type="number" id="valM3" min="0" value="0">
                </div>
                <div class="form-group">
                    <label style="color: #d1b200;">M4 - LA Collection (Yellow)</label>
                    <input type="number" id="valM4" min="0" value="0">
                </div>
                <div class="form-group">
                    <label style="color: red;">M5 - Others (Red)</label>
                    <input type="number" id="valM5" min="0" value="0">
                </div>
            </div>

            <button type="button" class="btn btn-update" onclick="saveWasteData()">Save Solid Waste Data</button>
            <button type="button" class="btn btn-print" onclick="window.print()">Print A4 Full Page</button>
        </form>
    </div>
</div>

<script>
    let chartTop, chartBottom;

    const methodLabels = ['M1', 'M2', 'M3', 'M4', 'M5'];
    
    // Exact Colors from PHI Manual Page 47
    const methodColors = [
        'black',    // M1 - Burning
        'navy',     // M2 - Burying
        'green',    // M3 - Composting
        'yellow',   // M4 - LA Removal
        'red'       // M5 - Others
    ];

    const borderColors = ['#000', '#000', '#000', '#000', '#000'];

    // Initial 0-filled datasets
    let wasteData = {
        top: [0, 0, 0, 0, 0],
        bottom: [0, 0, 0, 0, 0]
    };

    function initAutoYears() {
        const cYear = new Date().getFullYear();
        document.getElementById('inputYearTop').value = `PREVIOUS YEAR 2 (${cYear - 2})`;
        document.getElementById('inputYearBottom').value = `PREVIOUS YEAR 1 (${cYear - 1})`;
        applyYearHeaders();
    }

    function applyYearHeaders() {
        const topTxt = document.getElementById('inputYearTop').value;
        const bottomTxt = document.getElementById('inputYearBottom').value;

        document.getElementById('hdrPrevYear2').innerText = topTxt;
        document.getElementById('hdrPrevYear1').innerText = bottomTxt;

        document.getElementById('optYearTop').innerText = topTxt;
        document.getElementById('optYearBottom').innerText = bottomTxt;
    }

    function createWasteChart(ctx, dataValues) {
        return new Chart(ctx, {
            type: 'bar',
            data: {
                labels: methodLabels,
                datasets: [{
                    data: [...dataValues],
                    backgroundColor: methodColors,
                    borderColor: borderColors,
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: {
                        title: { display: true, text: 'METHOD', font: { weight: 'bold', size: 10 } },
                        ticks: { font: { size: 9, weight: 'bold' } },
                        grid: { display: false }
                    },
                    y: {
                        title: { display: true, text: 'NUMBER', font: { weight: 'bold', size: 10 } },
                        beginAtZero: true,
                        ticks: { precision: 0, font: { size: 9 } },
                        grid: { color: '#ccc' }
                    }
                }
            }
        });
    }

    window.onload = function() {
        initAutoYears();

        const ctxTop = document.getElementById('chartPrevYear2').getContext('2d');
        chartTop = createWasteChart(ctxTop, wasteData.top);

        const ctxBottom = document.getElementById('chartPrevYear1').getContext('2d');
        chartBottom = createWasteChart(ctxBottom, wasteData.bottom);
    };

    function saveWasteData() {
        const target = document.getElementById('targetGraphSelect').value;

        const m1 = parseInt(document.getElementById('valM1').value) || 0;
        const m2 = parseInt(document.getElementById('valM2').value) || 0;
        const m3 = parseInt(document.getElementById('valM3').value) || 0;
        const m4 = parseInt(document.getElementById('valM4').value) || 0;
        const m5 = parseInt(document.getElementById('valM5').value) || 0;

        if (target === 'top') {
            wasteData.top = [m1, m2, m3, m4, m5];
            chartTop.data.datasets[0].data = wasteData.top;
            chartTop.update();
        } else {
            wasteData.bottom = [m1, m2, m3, m4, m5];
            chartBottom.data.datasets[0].data = wasteData.bottom;
            chartBottom.update();
        }

        alert('Solid Waste Management Data updated successfully!');
    }
</script>

</body>
</html>
